<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secops Kft. - Élő Beléptető Kvíz</title>

  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- FIREWORK ANIMATION -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- FIREBASE LIBRARIES (Compat mode) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      --card-bg: rgba(255, 255, 255, 0.07);
      --card-border: rgba(255, 255, 255, 0.15);
      --primary: #8b5cf6;
      --accent-cyan: #06b6d4;
      --accent-pink: #ec4899;
      --accent-emerald: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app-layout {
      display: flex;
      gap: 20px;
      width: 100%;
      max-width: 1100px;
    }

    .quiz-container {
      flex: 1;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 30px;
    }

    .leaderboard-container {
      width: 320px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 24px;
      display: flex;
      flex-direction: column;
    }

    .brand-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .logo-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 20px;
    }

    .logo-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #06b6d4, #8b5cf6);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Form & Input */
    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 14px;
      margin-bottom: 8px;
      color: var(--text-muted);
    }

    .name-input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      background: rgba(0, 0, 0, 0.3);
      color: white;
      font-size: 16px;
      outline: none;
    }

    .name-input:focus { border-color: var(--accent-cyan); }

    .btn-action {
      background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
      color: #fff;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 14px;
      cursor: pointer;
      width: 100%;
      transition: transform 0.2s;
    }

    .btn-action:hover { transform: translateY(-2px); }

    /* Leaderboard List */
    .lb-title {
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .player-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      max-height: 450px;
    }

    .player-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .player-info { display: flex; align-items: center; gap: 10px; }
    .player-name { font-weight: 600; font-size: 14px; }
    .player-status { font-size: 12px; color: var(--accent-cyan); }
    .player-score { font-weight: 800; font-color: var(--accent-pink); font-size: 15px; }

    /* Quiz Area */
    .question-title { font-family: 'Outfit', sans-serif; font-size: 22px; margin-bottom: 20px; }
    .options-grid { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    
    .option-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 14px 18px;
      color: white;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
    }

    .option-btn:hover { background: rgba(255, 255, 255, 0.1); }
    .option-btn.selected { background: rgba(139, 92, 246, 0.3); border-color: var(--primary); }

    @media (max-width: 768px) {
      .app-layout { flex-direction: column; }
      .leaderboard-container { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="app-layout">
    <!-- MAIN QUIZ AREA -->
    <div class="quiz-container">
      <div class="brand-header">
        <div class="logo-badge">
          <div class="logo-icon"><i class="fa-solid fa-shield-halved"></i></div>
          <span>SECOPS <span style="color:var(--accent-cyan)">LIVE</span></span>
        </div>
      </div>

      <!-- LOGIN SCREEN -->
      <div id="login-screen">
        <h2 style="margin-bottom: 10px;">Csatlakozás a Kvízhez</h2>
        <p style="color: var(--text-muted); margin-bottom: 20px;">Add meg a neved a belépéshez, és küzdj meg a többiekkel élőben!</p>
        <div class="input-group">
          <label>Teljes név / Becenév:</label>
          <input type="text" id="username-input" class="name-input" placeholder="pl. Kovács Péter">
        </div>
        <button class="btn-action" onclick="joinQuiz()">Indulás! <i class="fa-solid fa-rocket"></i></button>
      </div>

      <!-- QUESTION SCREEN -->
      <div id="quiz-screen" style="display: none;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 14px; color: var(--accent-cyan);">
          <span id="q-counter">1 / 10 Kérdés</span>
        </div>
        <h2 id="q-title" class="question-title">Kérdés...</h2>
        <div id="options-container" class="options-grid"></div>
        <button id="next-btn" class="btn-action" onclick="nextQuestion()">Tovább <i class="fa-solid fa-arrow-right"></i></button>
      </div>

      <!-- RESULT SCREEN -->
      <div id="result-screen" style="display: none; text-align: center;">
        <h2>Kvíz Befejezve! 🎉</h2>
        <p style="margin: 15px 0; font-size: 18px;">Pontszámod: <b id="final-score" style="color: var(--accent-pink);">0</b> / 10</p>
        <p style="color: var(--text-muted);">Nézd meg a jobb oldali ranglistán, hanyadik helyen végeztél!</p>
      </div>
    </div>

    <!-- LIVE LEADERBOARD -->
    <div class="leaderboard-container">
      <div class="lb-title">
        <i class="fa-solid fa-trophy" style="color: var(--accent-pink);"></i> Élő Ranglista
      </div>
      <div id="player-list" class="player-list">
        <div style="color: var(--text-muted); font-size: 13px;">Csatlakozás a szerverhez...</div>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ IDE MÁSOLD BE A SAJÁT FIREBASE CONFIG-ODAT ⚠️
    const firebaseConfig = {

    apiKey: "AIzaSyAcmoMJm-Ra_k9CZaU-_6DS-IE3wlF9x4o",

    authDomain: "quiz-6bdbf.firebaseapp.com",

    projectId: "quiz-6bdbf",

    storageBucket: "quiz-6bdbf.firebasestorage.app",

    messagingSenderId: "538999682049",

    appId: "1:538999682049:web:3984f8f1e000823a0e3c00",

    measurementId: "G-NDTFCSVZ42"

  };


    // Firebase Inicializálása
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const questions = [
      { q: "Mire szolgál a vésznyitó (zöld gomb) a beléptető rendszerekben?", opts: ["Szoftveres értesítést küld.", "Megszakítja a zár tápellátását.", "Lezárja az ajtókat.", "Halk riasztást ad."], c: 1 },
      { q: "Milyen zárat ÉS kiegészítőt KÖTELEZŐ alkalmazni menekülési útvonalon?", opts: ["Fail-Secure + billentyűzet", "Motoros zár + nyitásérzékelő", "Fail-Safe + vésznyitó", "Síktapadó + kártyaelnyelő"], c: 2 },
      { q: "Milyen működésű a Fail-Safe zárszerkezet?", opts: ["Feszültségre nyit", "Áramkimaradásra nyit", "Csak feszültséggel marad nyitva", "Mindig reteszelve marad"], c: 1 },
      { q: "Mekkora a Wiegand protokoll max. javasolt távolsága a gyakorlatban?", opts: ["10-15 m", "30-40 m", "300-600 m", "90 m"], c: 1 },
      { q: "Melyik protokoll teszi lehetővé a 300-600 méteres távolságot és kétirányú kommunikációt?", opts: ["Wiegand", "IP / Ethernet", "OSDP (RS485)", "Bluetooth"], c: 2 },
      { q: "Mit kell figyelembe venni egy tűzgátló ajtó szerelésekor?", opts: ["Bárhol megfúrható", "Alapesetben nem fúrható meg", "Csak zsanér felől fúrható", "Cserélni kell fa ajtóra"], c: 1 },
      { q: "Milyen jelet ad át a Tűzjelző központ a beléptető felé?", opts: ["230V lökés", "Szárazkontaktus jelet", "Wiegand adatsort", "Ethernet csomagot"], c: 1 },
      { q: "Mekkora a max. kábelhossz Cat5e/Cat6 kábellel (IP/Ethernet)?", opts: ["40 m", "90 m", "300 m", "600 m"], c: 1 },
      { q: "Leggyakoribb kivitelezési hiba az RS485-nél?", opts: ["Túl vastag kábel", "Rossz topológia és lezáró ellenállás hiánya", "Wi-Fi interferencia", "Wiegand kioltás"], c: 1 },
      { q: "Melyik eszköz jelez, ha az ajtó FIZIKAILAG nyitva van?", opts: ["Kilépő gomb", "Kártyaolvasó", "Nyitásérzékelő", "Tápegység"], c: 2 }
    ];

    let myPlayerId = null;
    let currentQ = 0;
    let score = 0;
    let selectedOpt = null;

    // Élő Ranglista Figyelése
    db.collection("quiz_players").onSnapshot((snapshot) => {
      const listEl = document.getElementById("player-list");
      listEl.innerHTML = "";
      
      let players = [];
      snapshot.forEach(doc => players.push({ id: doc.id, ...doc.data() }));

      // Rendezés pontszám szerint
      players.sort((a, b) => b.score - a.score);

      players.forEach(p => {
        const card = document.createElement("div");
        card.className = "player-card";
        card.innerHTML = `
          <div class="player-info">
            <i class="fa-solid fa-user-circle" style="font-size: 20px;"></i>
            <div>
              <div class="player-name">${p.name} ${p.id === myPlayerId ? ' (Te)' : ''}</div>
              <div class="player-status">${p.qIndex < 10 ? (p.qIndex + 1) + '. kérdés' : 'Kész!'}</div>
            </div>
          </div>
          <div class="player-score">${p.score} pt</div>
        `;
        listEl.appendChild(card);
      });
    });

    function joinQuiz() {
      const name = document.getElementById("username-input").value.trim();
      if (!name) return alert("Kérlek, add meg a neved!");

      myPlayerId = 'p_' + Math.random().toString(36).substr(2, 9);
      
      // Játékos létrehozása az adatbázisban
      db.collection("quiz_players").doc(myPlayerId).set({
        name: name,
        score: 0,
        qIndex: 0,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        document.getElementById("login-screen").style.display = "none";
        document.getElementById("quiz-screen").style.display = "block";
        loadQuestion();
      });
    }

    function loadQuestion() {
      const q = questions[currentQ];
      document.getElementById("q-counter").textContent = `${currentQ + 1} / 10 Kérdés`;
      document.getElementById("q-title").textContent = `${currentQ + 1}. ${q.q}`;
      
      const optContainer = document.getElementById("options-container");
      optContainer.innerHTML = "";
      selectedOpt = null;

      q.opts.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = opt;
        btn.onclick = () => {
          document.querySelectorAll(".option-btn").forEach(b => b.classList.remove("selected"));
          btn.classList.add("selected");
          selectedOpt = idx;
        };
        optContainer.appendChild(btn);
      });
    }

    function nextQuestion() {
      if (selectedOpt === null) return alert("Válassz egy választ!");

      if (selectedOpt === questions[currentQ].c) {
        score++;
      }

      currentQ++;

      // Adatbázis frissítés Élőben
      db.collection("quiz_players").doc(myPlayerId).update({
        score: score,
        qIndex: currentQ
      });

      if (currentQ < questions.length) {
        loadQuestion();
      } else {
        document.getElementById("quiz-screen").style.display = "none";
        document.getElementById("result-screen").style.display = "block";
        document.getElementById("final-score").textContent = score;
        confetti();
      }
    }
  </script>
</body>
</html>
